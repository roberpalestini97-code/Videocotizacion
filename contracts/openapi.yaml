# GENERADO por fuente/generar.mjs — no editar a mano.
openapi: 3.1.0
info:
  title: VideoCotización API
  version: 0.1.4-borrador
  summary: Cotización de mano de obra por videollamada con avatar; API multi-tenant.
  description: |-
    Contrato **0.1.4-borrador** (borrador, candidato a 1.0.0). Fuente de verdad: `docs/BRIEF.md` y ADR 0001–0006.

    **Versionado.** Ruta con prefijo `/v1`; cambios incompatibles solo en `/v2`. Deprecaciones con encabezados `Deprecation` y `Sunset` y aviso en `GET /v1/version`. Los eventos del WebSocket y el encabezado binario NO están congelados (ver `eventos-sesion.md`).

    **Credenciales.** Clave secreta `vc_sec_` (servidor a servidor, nunca desde navegador: con `Origin` → 403). Clave pública del widget `vc_pub_` (solo crear sesión y leer configuración pública) con `Origin` exacto por tenant y `X-Desafio`. Token de sesión `vc_ses_` (una sola sesión). Panel: cookie `__Host-vc_panel` + `X-CSRF-Token`, TOTP y reautenticación. El `tenant_id` nunca es entrada: sale de la credencial.

    **Dinero.** Siempre `integer` int64 en centavos con `moneda`; precio calculado por Go, presupuesto orientativo.

    **Errores** (`application/problem+json`, campo `codigo`). Los 401 se distinguen por `codigo`:

    | codigo | HTTP | título |
    |---|---|---|
    | `solicitud_invalida` | 400 | Solicitud inválida |
    | `validacion_fallida` | 422 | Datos inválidos |
    | `cuerpo_demasiado_grande` | 413 | Pedido demasiado grande |
    | `tipo_de_contenido_no_soportado` | 415 | Tipo de contenido no soportado |
    | `credencial_ausente` | 401 | Falta la credencial |
    | `credencial_invalida` | 401 | Credencial inválida |
    | `credenciales_incorrectas` | 401 | Datos de ingreso incorrectos |
    | `totp_invalido` | 401 | Código incorrecto |
    | `sesion_vencida` | 401 | Sesión vencida |
    | `reautenticacion_requerida` | 401 | Confirmá tu identidad |
    | `origen_no_permitido` | 403 | Origen no permitido |
    | `desafio_invalido` | 403 | Verificación fallida |
    | `clave_secreta_desde_navegador` | 403 | Credencial usada desde un navegador |
    | `alcance_insuficiente` | 403 | Sin permiso |
    | `csrf_invalido` | 403 | Pedido no verificado |
    | `no_encontrado` | 404 | No encontrado |
    | `version_retirada` | 410 | Versión retirada |
    | `estado_invalido` | 409 | Estado inválido |
    | `consentimiento_requerido` | 409 | Falta el consentimiento |
    | `sesion_cerrada` | 409 | Sesión cerrada |
    | `cotizacion_no_emitida` | 409 | Presupuesto pendiente |
    | `contacto_ya_registrado` | 409 | Contacto ya registrado |
    | `limite_de_tasa` | 429 | Demasiados pedidos |
    | `cuota_agotada` | 429 | Cupo agotado |
    | `simultaneas_agotadas` | 429 | Todos los asesores ocupados |
    | `intentos_excedidos` | 429 | Demasiados intentos |
    | `limite_lecturas_contacto` | 429 | Límite de lecturas |
    | `error_interno` | 500 | Error interno |
    | `proveedor_no_disponible` | 503 | Servicio no disponible |
    | `servicio_no_disponible` | 503 | Servicio no disponible |

    Montos de los ejemplos: ilustrativos, no son tarifas. Lo legal (Ley 25.326): a validar con abogado.
  contact:
    name: Arquitectura VideoCotización
    email: arquitectura@videocotizacion.local
  license:
    name: Propietaria
    identifier: LicenseRef-Propietaria
servers:
  - url: https://api.{dominio}
    description: Dominio a definir (P4).
    variables:
      dominio:
        default: videocotizacion.local
        description: Dominio propio pendiente.
tags:
  - name: Widget
    description: Rutas del widget con clave pública.
  - name: Sesiones
    description: Ciclo de vida de la videocotización.
  - name: Cotizaciones
    description: Presupuesto emitido al final.
  - name: Derivacion
    description: Derivación a WhatsApp.
  - name: Privacidad
    description: Aviso, retención y ARCO (Ley 25.326, a validar con abogado).
  - name: Consumo
    description: Cuotas y consumo.
  - name: Meta
    description: Versión y textos.
  - name: Panel
    description: "Panel del asesor: Perfil, Mis cotizaciones, Registros."
security: []

                $ref: "#/components/schemas/Error"
              examples:
                csrf_invalido:
                  summary: Pedido no verificado
                  value:
                    type: https://videocotizacion.local/errores/csrf_invalido
                    title: Pedido no verificado
                    status: 403
                    codigo: csrf_invalido
                    detail: No pudimos verificar el pedido. Recargá el panel.
                    id_traza: tr_5a8b2a912dba267c
                origen_no_permitido:
                  summary: Origen no permitido
                  value:
                    type: https://videocotizacion.local/errores/origen_no_permitido
                    title: Origen no permitido
                    status: 403
                    codigo: origen_no_permitido
                    detail: Este sitio no está autorizado para usar la clave.
                    id_traza: tr_5711dd8dd21ea0b4
        "429":
          description: Límite o cupo (ver `codigo`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                limite_de_tasa:
                  summary: Demasiados pedidos
                  value:
                    type: https://videocotizacion.local/errores/limite_de_tasa
                    title: Demasiados pedidos
                    status: 429
                    codigo: limite_de_tasa
                    detail: Hiciste muchos pedidos seguidos. Esperá un momento.
                    id_traza: tr_837727798aafd62a
                    reintentar_en_s: 30
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "500":
          description: Error interno
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                error_interno:
                  summary: Error interno
                  value:
                    type: https://videocotizacion.local/errores/error_interno
                    title: Error interno
                    status: 500
                    codigo: error_interno
                    detail: Tuvimos un problema. Intentá de nuevo más tarde.
                    id_traza: tr_5a61d98deae3f8e3
components:
  securitySchemes:
    claveSecreta:
      type: http
      scheme: bearer
      bearerFormat: vc_sec_…
      description: Clave secreta del tenant (R1). Prohibida desde navegador (R2).
    tokenSesion:
      type: http
      scheme: bearer
      bearerFormat: vc_ses_…
      description: Token de una sola sesión, emitido por crearSesion.
    clavePublica:
      type: apiKey
      in: header
      name: X-VC-Clave-Publica
      description: Clave pública del widget (R54), atada a Origin exactos (R55).
    desafio:
      type: apiKey
      in: header
      name: X-Desafio
      description: "Desafío resuelto: `<desafio>.<nonce hex 16>`, de un uso (R53)."
    cookiePanel:
      type: apiKey
      in: cookie
      name: __Host-vc_panel
      description: Sesión del panel (R33).
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token CSRF ligado a la sesión del panel (R36).
  parameters:
    sesion_id:
      name: sesion_id
      in: path
      required: true
      description: Id de la sesión.
      schema:
        $ref: "#/components/schemas/IdSesion"
      examples:
        ses_a:
          summary: Sesión
          value: ses_SX2NE9K3Z89ZMZHZHV6ZR2J79H
        ses_b:
          summary: Otra sesión
          value: ses_8DFD38WHB3W4XHDJXCHA44FHWQ
    id_publico:
      name: id_publico
      in: path
      required: true
      description: id_publico del enlace opaco del profesional.
      schema:
        $ref: "#/components/schemas/IdPublicoEnlace"
      examples:
        enlace_a:
          summary: Enlace
          value: WxoyJSebjQ2qgzlPxgXnjq
        enlace_b:
          summary: Otro enlace
          value: TGV1TOOc-4bD0HVKCPfk07
    clave_id:
      name: clave_id
      in: path
      required: true
      description: Id de gestión de la clave pública.
      schema:
        $ref: "#/components/schemas/IdClaveWidget"
      examples:
        clave_a:
          summary: Clave
          value: cpw_ZKWA18CB675A5VQR44CQD0NDXA
    Origin:
      name: Origin
      in: header
      required: true
      description: Origin del navegador; debe estar en la lista exacta de la clave pública (R55).
      schema:
        $ref: "#/components/schemas/Origin"
      examples:
        origin_ok:
          summary: Origin permitido
          value: https://cotizar.videocotizacion.local
    OriginOpcional:
      name: Origin
      in: header
      required: false
      description: Obligatorio con clave pública. Con clave secreta su presencia provoca 403 clave_secreta_desde_navegador (R2).
      schema:
        $ref: "#/components/schemas/Origin"
      examples:
        origin_widget:
          summary: Widget
          value: https://cotizar.videocotizacion.local
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Reintento seguro de crearSesion (24 h).
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{16,64}$
      examples:
        idem:
          summary: Clave
          value: b1946ac92492d2347c62
    cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco de la página siguiente.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{16,200}$
      examples:
        cursor:
          summary: Cursor
          value: QWxndW5DdXJzb3JPcGFjbw
    limite:
      name: limite
      in: query
      required: false
      description: Tamaño de página (1–100, por defecto 20).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      examples:
        l20:
          summary: "20"
          value: 20
        l50:
          summary: "50"
          value: 50
    oficio:
      name: oficio
      in: query
      required: false
      description: Filtro por oficio.
      schema:
        $ref: "#/components/schemas/Oficio"
      examples:
        pintura:
          summary: Pintura
          value: pintura
    desde:
      name: desde
      in: query
      required: false
      description: Desde (fecha, inclusive).
      schema:
        type: string
        format: date
      examples:
        desde:
          summary: Desde
          value: 2026-10-01
    hasta:
      name: hasta
      in: query
      required: false
      description: Hasta (fecha, inclusive).
      schema:
        type: string
        format: date
      examples:
        hasta:
          summary: Hasta
          value: 2026-10-31
    periodo:
      name: periodo
      in: query
      required: false
      description: Mes AAAA-MM (por defecto el actual).
      schema:
        type: string
        pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      examples:
        oct:
          summary: Octubre 2026
          value: 2026-10
  headers:
    RetryAfter:
      description: Segundos hasta poder reintentar (R8, R57).
      schema:
        type: integer
        minimum: 1
        maximum: 86400
      examples:
        corto:
          summary: 30 s
          value: 30
        cuota:
          summary: 1 h
          value: 3600
    SetCookiePanel:
      description: "Cookie de sesión del panel: Secure, HttpOnly, SameSite=Strict, Path=/, sin Domain (R33)."
      schema:
        type: string
        pattern: ^__Host-vc_panel=[A-Za-z0-9_-]{22,}; Path=/; Secure; HttpOnly; SameSite=Strict(; Max-Age=[0-9]+)?$
      examples:
        cookie:
          summary: Cookie
          value: __Host-vc_panel=Q2FkZW5hT3BhY2FEZVNlc2lvbjEyMzQ1Njc4OTA; Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=43200
  schemas:

# Autenticación de PostgreSQL para VideoCotización (reemplaza el pg_hba.conf por defecto).
# TYPE      DATABASE  USER      ADDRESS      METHOD
# Socket local dentro del contenedor: solo el superusuario del SO (docker exec, backups, inicialización).
local       all       postgres               peer
local       all       all                    reject
# Red: solo TLS y contraseña SCRAM. La red "datos" es interna (sin salida ni puertos publicados).
hostssl     all       all       0.0.0.0/0    scram-sha-256
hostssl     all       all       ::/0         scram-sha-256
# Lo que llegue sin TLS se rechaza explícitamente.
host        all       all       0.0.0.0/0    reject
host        all       all       ::/0         reject

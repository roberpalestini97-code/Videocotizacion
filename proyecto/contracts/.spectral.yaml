# Spectral: reglas OAS recomendadas + reglas propias del contrato VideoCotización.
extends: [["spectral:oas", "recommended"]]
rules:
  oas3-valid-media-example: error
  oas3-valid-schema-example: error
  operation-operationId: error
  operation-description: error
  operation-tags: error
  info-contact: error
  vc-sin-tenant-id-como-entrada:
    description: El tenant sale de la credencial (R3); ningún parámetro puede llamarse tenant_id.
    severity: error
    given: "$.paths[*][*].parameters[*].name"
    then:
      function: pattern
      functionOptions:
        notMatch: "^tenant_id$"
  vc-seguridad-explicita:
    description: Cada operación declara security, aunque sea vacía (O05).
    severity: error
    given: "$.paths[*][get,post,put,patch,delete]"
    then:
      field: security
      function: truthy
  vc-errores-problem-json:
    description: Las respuestas 4xx/5xx usan application/problem+json (R31).
    severity: error
    given: "$.paths[*][*].responses[?(@property.match(/^[45]/))].content"
    then:
      field: application/problem+json
      function: truthy
  vc-operationid-camel:
    description: operationId en camelCase.
    severity: error
    given: "$.paths[*][*].operationId"
    then:
      function: casing
      functionOptions:
        type: camel

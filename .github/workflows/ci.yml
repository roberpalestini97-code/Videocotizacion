# CI de VideoCotización (T12). Corre en cada PR hacia main y en cada push a main.
# El job verificar-repo usa el mismo script que se corre a mano (proyecto/scripts/verificar-repo.ps1),
# así lo local y el CI no se separan. El resto suma lo que T12 pide y el script no cubre:
# vet y vulnerabilidades de Go, lint del OpenAPI, lint/tests/build de los dos fronts, npm audit y secretos.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Con los arreglos de net/http y crypto/tls (govulncheck); misma versión que infra/docker/api.Dockerfile.
  GO_VERSION: "1.27.2"
  NODE_VERSION: "22"

jobs:
  verificar-repo:
    name: verificar-repo (Go, conductas, contrato, Lovable, compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: proyecto/backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            proyecto/conductas/package-lock.json
            proyecto/contracts/verificacion/package-lock.json
            real-time-quote-bot/package-lock.json
      - name: npm ci
        run: |
          npm ci --prefix proyecto/conductas
          npm ci --prefix proyecto/contracts/verificacion
          npm ci --prefix real-time-quote-bot
      - name: verificar-repo.ps1
        shell: pwsh
        run: ./proyecto/scripts/verificar-repo.ps1

  go:
    name: Go (vet + govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: proyecto/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: proyecto/backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  contrato-lint:
    name: OpenAPI (redocly + spectral)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: proyecto/contracts/verificacion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: proyecto/contracts/verificacion/package-lock.json
      - run: npm ci
      - run: npm run redocly
      - run: npm run spectral

  videollamada:
    name: Videollamada Lovable (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: real-time-quote-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: real-time-quote-bot/package-lock.json
      - run: npm ci
      # Valores públicos (AGENTS.md); el build los necesita.
      - run: cp .env.example .env.local
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  panel:
    name: Panel del asesor (contrato, typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: proyecto/panel-asesor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: proyecto/panel-asesor/package-lock.json
      - run: npm ci
      - run: npm run todo

  dependencias:
    name: npm audit (dependencias de producción, severidad alta)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit
        run: |
          for d in real-time-quote-bot proyecto/panel-asesor proyecto/conductas proyecto/contracts/verificacion; do
            echo "== $d"
            (cd "$d" && npm audit --omit=dev --audit-level=high)
          done

  secretos:
    name: Secretos (gitleaks)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
